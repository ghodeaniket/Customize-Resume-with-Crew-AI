# Locust configuration file for Resume Customizer performance testing

# Host (should be overridden with --host command line parameter)
host = http://localhost:8000

# Task execution rate
spawn-rate = 5
users = 20
run-time = 10m

# Test behaviors
only-summary = false
headless = false
autostart = false

# Log settings
loglevel = INFO
logfile = locust.log

# CSV stats
csv = locust_stats
csv-full-history = false

# Web UI
web-port = 8089
web-host = 0.0.0.0

# Stopping conditions
stop-timeout = 30
