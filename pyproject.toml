[project]
name = "resume_customizer_crewai"
version = "0.1.0"
description = "Resume customizer backend application built with FastAPI and CrewAI"
authors = [
    { name = "Your Name", email = "you@example.com" }
]
requires-python = ">=3.10,<3.13"
readme = "README.md"
license = { text = "MIT" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.poetry]
name = "resume_customizer_crewai"
version = "0.1.0"
description = "Resume customizer backend application built with FastAPI and CrewAI"
authors = ["Your Name <you@example.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.10"
fastapi = "^0.104.1"
uvicorn = "^0.24.0"
pydantic = "^2.4.2"
pydantic-settings = "^2.0.3"
python-multipart = "^0.0.6"
crewai = "^0.28.8"
crewai-tools = "^0.1.6"
pypdf2 = "^3.0.0"
pymupdf = "^1.23.0"
python-docx = "^0.8.11"
loguru = "^0.7.2"
aiofiles = "^23.2.1"
httpx = "^0.25.1"
asyncio = "^3.4.3"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.3"
pytest-cov = "^4.1.0"
black = "^23.10.1"
isort = "^5.12.0"
pylint = "^3.0.2"
pytest-asyncio = "^0.21.1"
httpx = "^0.25.1"

[tool.black]
line-length = 88
target-version = ["py310"]
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3

[tool.pylint.messages_control]
disable = [
    "missing-docstring",
    "invalid-name",
    "too-few-public-methods",
]

[tool.pylint.format]
max-line-length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.poetry.scripts]
start = "main:app"
dev = "uvicorn main:app --reload"

[tool.crewai]
type = "crew"
