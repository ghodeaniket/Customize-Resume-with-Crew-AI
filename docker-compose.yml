version: '3.8'

services:
  app:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./:/app
      - ./uploads:/app/uploads
    environment:
      - DEBUG=True
      - LLM_PROVIDER=openai
      - LLM_API_KEY=${LLM_API_KEY}
    restart: always
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
